name: Deploy Production

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Create .env File
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_PRODUCTION }}
          EOF

      - name: Install Dependencies
        run: npm install --force

      - name: Build Application
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps: # <--- Fix indentation here
      - name: Executing remote SSH commands using password
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_PRODUCTION }}
          username: ${{ secrets.USERNAME_PRODUCTION }}
          password: ${{ secrets.PASSWORD_PRODUCTION }}
          port: ${{ secrets.PORT_PRODUCTION }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22 || export PATH=$HOME/.nvm/versions/node/v22/bin:$PATH

            cd ~/trello-web
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            cat <<EOF > .env
            ${{ secrets.ENV_PRODUCTION }}
            EOF

            npm install --force --yes

            npm run build

            # Restart PM2
            pm2 restart trello-clone-web 
            pm2 save

            exit  # Force SSH session to close
